    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do you play Piano Invaders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Notes fall from a UFO at the top of the screen. Press the matching piano key (click/tap on mobile, or use your computer keyboard with Ableton-style mapping) to shoot the note before it hits the ground. Score points for correct hits. The game ends when your HP reaches 0 from missed notes."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use my computer keyboard to play Piano Invaders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Piano Invaders uses Ableton-style QWERTY mapping: A=B, S=C, D=D, F=E, G=F, H=G, J=A, K=B, L=C for white keys. Black keys use the row above: E=C#, R=D#, Y=F#, U=G#, I=A#, P=C#4, [=D#4."
          }
        },
        {
          "@type": "Question",
          "name": "Is Piano Invaders free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Piano Invaders is completely free to play in your browser. You can also install it as a PWA on your phone or tablet for an app-like experience with no download required."
          }
        },
        {
          "@type": "Question",
          "name": "Can I import my own songs into Piano Invaders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Piano Invaders supports the Dottl song format (.dottl). You can import .dottl files from the start screen using the Import button. Songs created in any Dottl ecosystem app are compatible."
          }
        },
        {
          "@type": "Question",
          "name": "What songs are included in Piano Invaders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Piano Invaders includes 7 classic songs: Ode to Joy, Twinkle Twinkle, Mary Had a Lamb, Happy Birthday, Frere Jacques, Blue Danube, and Fur Elise. Difficulties range from Easy to Advanced."
          }
        }
      ]
    }
    </script>
